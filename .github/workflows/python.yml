name: python

env:
  PYTHON_VERSION: "3.12"

on:
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/python/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: src/python/pyproject.toml
      - name: Install dependencies
        working-directory: src/python
        run: make install-dev
      - name: Run checks
        working-directory: src/python
        run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: src/python/pyproject.toml
      # The cherrymountain app's tests run on the topology it provisions
      # (phenix_apps/apps/cherrymountain/tests/topology.py); without this
      # checkout they are skipped. After a topology change, move the commit and
      # record the test fixtures again (the app's README, Tests).
      - name: Check out the CherryMountain Brewery topology
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GhostofGoes/sceptre-phenix-topologies
          ref: a2b7b9adcaa00f0699ee240b185d817ce64678f6 # feat-cherrymountain-multisite
          path: topologies
          sparse-checkout: cherrymountain-brewery
          lfs: true
          persist-credentials: false
      # The cherrymountain app's test_template_lint.py runs shellcheck,
      # systemd-analyze, and desktop-file-validate. The runner image has the
      # first two. With CI set, the tests fail when a tool is missing.
      - name: Install desktop-file-validate
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends desktop-file-utils
      - name: Run Tests
        working-directory: src/python
        env:
          CHERRYMOUNTAIN_TOPOLOGY_DIR: ${{ github.workspace }}/topologies/cherrymountain-brewery
        run: |
          make install-dev
          make test
